name: Deploy VitePress site to Pages

on:
  # 推送到 main 分支时自动部署
  push:
    branches: [main]
  # 允许在 GitHub 页面手动触发部署
  workflow_dispatch:

# 允许 GitHub Actions 写 Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署任务，新推送会取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 保留提交历史，用于显示"最后更新时间"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 根据仓库名决定 base 路径：
      # - 仓库是 <用户名>.github.io 时，站点部署在根路径 /
      # - 仓库是 blog 等其他名字时，站点部署在 /仓库名/
      - name: Determine base path
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "BASE_PATH=/" >> "$GITHUB_ENV"
          else
            echo "BASE_PATH=/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
